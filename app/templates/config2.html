{% extends "base.html" %}
{% block title %}Параметры{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Системные параметры</h2>
    <div>
        <button class="btn btn-outline-primary btn-sm me-2" onclick="addConfigRow()"><i class="bi bi-plus"></i> Добавить</button>
        <button class="btn btn-primary btn-sm" onclick="saveConfig()">Сохранить</button>
    </div>
</div>
<div class="card">
    <div class="card-body">
        <div id="configList">
            {% for key, val in config.items() %}
            <div class="mb-3"><label class="form-label text-muted small">{{ key }}</label><input type="text" class="form-control" data-key="{{ key }}" value="{{ val }}" onchange="saveConfig()"></div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function addConfigRow() { const k = prompt('Ключ параметра:'); if (!k) return; const d = document.createElement('div'); d.className='mb-3'; d.innerHTML = `<label class="form-label text-muted small">${k}</label><input type="text" class="form-control" data-key="${k}" onchange="saveConfig()">`; document.getElementById('configList').appendChild(d); }
async function saveConfig() { const data = {}; document.querySelectorAll('#configList input').forEach(inp => { data[inp.dataset.key] = inp.value; }); await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}); alert('Сохранено'); }
</script>
{% endblock %}
