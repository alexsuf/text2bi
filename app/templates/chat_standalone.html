<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>SQL Чат — объяснение</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="{{ url_for('static', filename='export-utils.js') }}"></script>
    <style>
        /* Стили для кнопок скачивания в сообщении ассистента */
        .message.assistant .download-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--border-light, #333);
        }

        .message.assistant .download-buttons .dl-btn {
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .message.assistant .download-buttons .dl-btn:hover {
            transform: translateY(-1px);
            opacity: 1;
            box-shadow: 0 2px 8px rgba(0, 102, 255, 0.3);
        }

        .message.assistant .download-buttons .dl-btn:active {
            transform: translateY(0);
        }

        .message.assistant .download-buttons .dl-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== DROPDOWN ДЛЯ СКАЧИВАНИЯ ===== */
        .dl-dropdown-wrapper {
            position: relative;
            display: inline-block;
        }

        .message.assistant .download-buttons .dl-btn.btn-download {
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.85;
            white-space: nowrap;
        }

        .message.assistant .download-buttons .dl-btn.btn-download:hover {
            opacity: 1;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 102, 255, 0.3);
        }

        .dl-dropdown-menu {
            display: none;
            position: absolute;
            bottom: calc(100% + 6px);
            right: 0;
            background: var(--bg-surface, #2b2b2b);
            border: 1px solid var(--border-default, #444);
            border-radius: 10px;
            padding: 6px 0;
            min-width: 180px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.4);
            z-index: 200;
            animation: dropdownFadeIn 0.15s ease;
        }

        .dl-dropdown-menu.show {
            display: block;
        }

        @keyframes dropdownFadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .dl-dropdown-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 9px 16px;
            background: none;
            border: none;
            color: var(--text-primary, #f5f5f5);
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s;
            margin: 0;
            border-radius: 0;
            font-weight: 500;
            font-family: inherit;
            box-shadow: none;
            transform: none;
            opacity: 1;
            letter-spacing: 0;
            text-transform: none;
        }

        .dl-dropdown-item:hover {
            background: var(--bg-surface-alt, #333);
            transform: none !important;
            opacity: 1 !important;
            box-shadow: none !important;
        }

        .dl-dropdown-item:active {
            background: var(--bg-surface-alt, #444);
            transform: none !important;
        }

        .dl-dropdown-item .dl-icon {
            font-size: 16px;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .dl-dropdown-item .dl-label {
            flex: 1;
        }

        .dl-dropdown-item .dl-ext {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dl-dropdown-divider {
            height: 1px;
            background: var(--border-light, #333);
            margin: 4px 0;
        }

        .dl-dropdown-item.dl-disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .dl-dropdown-item.dl-disabled:hover {
            background: none;
        }

        /* ===== СТИЛИ ДЛЯ МИКРОФОНА ===== */
        .input-area .mic-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--shadow-btn);
            padding: 0;
            margin: 0;
        }

        .input-area .mic-btn:hover {
            transform: translateY(-2px);
            opacity: 0.92;
            box-shadow: var(--shadow-btn-hover);
        }

        .input-area .mic-btn.recording {
            background: var(--gradient-danger);
            animation: micPulse 1.5s infinite;
        }

        .input-area .mic-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .input-area .mic-btn .mic-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 100;
        }

        .input-area .mic-btn {
            position: relative;
        }

        .input-area .mic-btn:hover .mic-tooltip {
            display: block;
        }

        .input-area .mic-status {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 80px;
            text-align: center;
            transition: color 0.3s ease;
        }

        .input-area .mic-status.listening {
            color: #ff6666;
            font-weight: 600;
        }

        .input-area .mic-status.processing {
            color: #ffa500;
            font-weight: 600;
        }

        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        /* ===== СТИЛИ ДЛЯ РЕЗУЛЬТАТА SQL В ЧАТЕ ===== */
        .sql-result-block {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 12px;
            margin-top: 8px;
            max-height: 400px;
            overflow: auto;
        }

        .sql-result-block table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .sql-result-block th,
        .sql-result-block td {
            border: 1px solid var(--border-table);
            padding: 6px 8px;
            text-align: left;
        }

        .sql-result-block th {
            background: var(--bg-table-header);
            color: var(--text-accent);
            font-weight: 600;
        }

        .sql-result-block tr:nth-child(even) {
            background: var(--bg-table-alt);
        }

        .sql-result-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .sql-error-block {
            background: var(--bg-error-block);
            border: 1px solid var(--border-error);
            border-radius: 12px;
            padding: 12px;
            margin-top: 8px;
            color: var(--text-error-bright);
            font-size: 13px;
            white-space: pre-wrap;
        }

        .sql-error-analyze-btn {
            background: var(--gradient-primary) !important;
            color: white !important;
            border: none !important;
            padding: 4px 12px !important;
            border-radius: 6px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            margin-top: 8px !important;
            display: inline-block !important;
            transition: opacity 0.2s !important;
        }

        .sql-error-analyze-btn:hover {
            opacity: 0.9 !important;
            transform: none !important;
        }

        /* Индикатор обновления SQL-контекста */
        .sql-context-updated {
            display: inline-block;
            font-size: 10px;
            background: var(--gradient-success);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
            font-weight: 600;
            animation: fadeIn 0.3s ease;
        }

        /* =============================================
           СТИЛИ ДЛЯ КНОПКИ "ЗАПУСТИТЬ КОД"
           ============================================= */

        .run-code-btn {
            position: absolute;
            top: 8px;
            right: 62px;
            z-index: 10;
            background: var(--gradient-success);
            border: none;
            color: white;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.4;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin: 0;
            font-family: inherit;
            box-shadow: var(--shadow-btn);
            transform: none;
            font-weight: 600;
        }

        .markdown-content pre:hover .run-code-btn {
            opacity: 1;
        }

        .run-code-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px) !important;
            box-shadow: var(--shadow-btn-hover);
        }

        .run-code-btn:active {
            transform: scale(0.95) !important;
        }

        .run-code-btn.running {
            opacity: 1;
            background: var(--gradient-btn-disabled);
            cursor: wait;
        }

        /* ===== СТИЛИ ДЛЯ SQL-ПРЕВЬЮ В ХЕДЕРЕ ===== */
        .header .sql-context-display {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
            max-width: 55%;
        }

        .header .sql-context-display .sql-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .header .sql-context-display .sql-value {
            font-size: 12px;
            color: var(--text-preview);
            background: var(--bg-input);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-light);
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: monospace;
            transition: all 0.3s ease;
        }

        .header .sql-context-display .sql-value.updated {
            border-color: var(--text-success);
            box-shadow: 0 0 8px rgba(0, 170, 85, 0.3);
        }
    </style>
</head>

<body class="chat-page">

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <h1>🧠 SQL Чат</h1>
            <span class="model-name">🧠 {{ llm_model }}</span>
        </div>
        <div class="sql-context-display">
            <span class="sql-label">SQL-контекст:</span>
            <span class="sql-value" id="sqlPreview" title="{{ sql_query }}">{{ sql_query }}</span>
        </div>
    </div>

    <!-- CHAT MESSAGES -->
    <div class="chat-messages" id="chatMessages">
        <div class="message assistant loading-msg" id="loadingMsg">
            <div class="msg-label">Ассистент</div>
            <div class="typing-indicator">
                <span></span><span></span><span></span>
            </div>
            <div style="margin-top:6px; color:var(--text-secondary); font-size:13px;">
                Анализирую SQL-запрос...
            </div>
        </div>
    </div>

    <!-- INPUT AREA (с микрофоном) -->
    <div class="input-area">
        <textarea
            id="questionInput"
            placeholder="Задай вопрос про SQL-запрос или структуру базы..."
            rows="1"
        ></textarea>

        <!-- КНОПКА МИКРОФОНА -->
        <button class="mic-btn" id="micBtn" title="Голосовой ввод" type="button">
            🎤
            <span class="mic-tooltip">Голосовой ввод</span>
        </button>

        <span class="mic-status" id="micStatus"></span>

        <button class="ask-btn" id="askBtn" disabled>
            Спросить →
        </button>
        <button class="graf-btn" id="grafBtn" type="button" title="Открыть график">График</button>
        <button class="table-btn" id="tableBtn" type="button" title="Открыть таблицу">Таблица</button>
    </div>

<script>
    // ==========================================
    // THEME — применяем сохранённую тему
    // =========================================
    (function() {
        const savedTheme = localStorage.getItem('app-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    })();

    // =========================================
    // STATE
    // =========================================
    let sqlQuery = {{ sql_query|tojson }} || "";
    let lastExecutedSql = sqlQuery;
    let lastSqlResult = null;
    let lastSqlResultData = "";

    let messages = [];

    const chatMessages = document.getElementById("chatMessages");
    const questionInput = document.getElementById("questionInput");
    const askBtn = document.getElementById("askBtn");
    const grafBtn = document.getElementById("grafBtn");
    const tableBtn = document.getElementById("tableBtn");
    const loadingMsg = document.getElementById("loadingMsg");
    const micBtn = document.getElementById("micBtn");
    const micStatus = document.getElementById("micStatus");
    const sqlPreview = document.getElementById("sqlPreview");

    // =========================================
    // ГОЛОСОВОЙ ВВОД (SpeechRecognition)
    // =========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let isRecording = false;
    let fullVoiceText = '';
    let silenceTimer = null;
    const SILENCE_TIMEOUT = 7000;

    function resetSilenceTimer() {
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
            console.log('[VOICE] Тишина -> stop()');
            if (recognition) {
                recognition.stop();
            }
        }, SILENCE_TIMEOUT);
    }

    async function requestMicPermission() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return false;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => track.stop());
            return true;
        } catch (err) {
            console.error('[VOICE] Mic error:', err);
            alert('❌ Доступ к микрофону запрещён. Разрешите использование микрофона в настройках браузера.');
            return false;
        }
    }

    function initRecognition() {
        if (!SpeechRecognition) {
            micBtn.disabled = true;
            micBtn.style.opacity = '0.4';
            micStatus.textContent = ' Не поддерживается';
            return null;
        }

        const rec = new SpeechRecognition();
        rec.lang = 'ru-RU';
        rec.interimResults = true;
        rec.continuous = true;
        rec.maxAlternatives = 1;

        rec.onresult = function (event) {
            resetSilenceTimer();

            let interim = '';
            let final = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const result = event.results[i];
                if (result.isFinal) {
                    final += result[0].transcript;
                } else {
                    interim += result[0].transcript;
                }
            }

            if (final) {
                fullVoiceText += ' ' + final;
                questionInput.value = fullVoiceText.trim();
                questionInput.style.height = "auto";
                questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + "px";

                micStatus.textContent = ' Распознано';
                micStatus.className = 'mic-status';

                fetch('/speech', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: final })
                })
                .then(r => r.json())
                .then(data => console.log('[VOICE] Сервер:', data))
                .catch(err => console.error('[VOICE] Ошибка отправки:', err));

            } else if (interim) {
                questionInput.value = fullVoiceText.trim() + ' ' + interim;
                questionInput.style.height = "auto";
                questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + "px";

                micStatus.textContent = ' Распознаю...';
                micStatus.className = 'mic-status listening';
            }
        };

        rec.onend = function () {
            clearTimeout(silenceTimer);

            if (isRecording) {
                micStatus.textContent = ' Пауза... продолжаю';
                micStatus.className = 'mic-status processing';

                setTimeout(() => {
                    try {
                        rec.start();
                        resetSilenceTimer();
                    } catch (e) {
                        console.log('[VOICE] restart error:', e);
                    }
                }, 400);
            } else {
                resetVoiceUI();
            }
        };

        rec.onerror = function (event) {
            console.error('[VOICE] Speech error:', event.error);

            if (event.error === 'not-allowed') {
                micStatus.textContent = ' Нет доступа к микрофону';
                resetVoiceUI();
                return;
            }

            if (event.error === 'no-speech') {
                micStatus.textContent = ' Тишина';
                return;
            }

            if (event.error !== 'aborted') {
                micStatus.textContent = ' Ошибка: ' + event.error;
            }
        };

        return rec;
    }

    function resetVoiceUI() {
        isRecording = false;
        micBtn.classList.remove('recording');
        micStatus.textContent = '';
        micStatus.className = 'mic-status';
        clearTimeout(silenceTimer);
    }

    micBtn.addEventListener('click', async function () {
        if (isRecording) {
            isRecording = false;
            if (recognition) {
                recognition.stop();
            }
            micStatus.textContent = ' Запись остановлена';
            return;
        }

        if (!SpeechRecognition) {
            micBtn.disabled = true;
            micStatus.textContent = ' Не поддерживается';
            return;
        }

        const permitted = await requestMicPermission();
        if (!permitted) return;

        if (!recognition) {
            recognition = initRecognition();
            if (!recognition) return;
        }

        try {
            recognition.start();
            resetSilenceTimer();
            isRecording = true;
            micBtn.classList.add('recording');
            micStatus.textContent = ' Слушаю...';
            micStatus.className = 'mic-status listening';
            fullVoiceText = questionInput.value.trim() ? questionInput.value.trim() : '';
        } catch (e) {
            console.error('[VOICE] start error:', e);
            resetVoiceUI();
        }
    });

    questionInput.addEventListener('input', function () {
        if (!isRecording) {
            fullVoiceText = this.value;
        }
    });

    // =========================================
    // ФОРМАТИРОВАНИЕ ДАТЫ ДЛЯ ИМЁН ФАЙЛОВ
    // =========================================
    function formatDateForFilename(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const h = String(date.getHours()).padStart(2, '0');
        const min = String(date.getMinutes()).padStart(2, '0');
        const s = String(date.getSeconds()).padStart(2, '0');
        return `${y}-${m}-${d} ${h}-${min}-${s}`;
    }

    // =========================================
    // ПОЛУЧЕНИЕ ПОСЛЕДНЕГО ОТВЕТА АССИСТЕНТА
    // =========================================
    function getLastAssistantRawContent() {
        const allMessages = document.querySelectorAll('.chat-messages .message.assistant:not(.loading-msg)');
        if (allMessages.length === 0) return '';
        const lastMsg = allMessages[allMessages.length - 1];
        const raw = lastMsg.getAttribute('data-raw-content');
        if (raw) return raw;
        const contentDiv = lastMsg.querySelector('.markdown-content');
        return contentDiv ? contentDiv.textContent : '';
    }

    // =========================================
    // СКАЧИВАНИЕ TEXT (.txt)
    // =========================================
    function downloadChatText() {
        const content = getLastAssistantRawContent();
        if (!content) return;
        downloadAsText(content, 'chat.txt', 'markdown');
    }

    // =========================================
    // СКАЧИВАНИЕ EXCEL (.xlsx) — ТОЛЬКО ЕСЛИ ЕСТЬ ТАБЛИЦА
    // =========================================
    function downloadChatExcel() {
        if (!lastSqlResult || !lastSqlResult.rows || lastSqlResult.rows.length === 0) {
            alert('Нет табличных данных для экспорта в Excel.\nВыполните SQL-запрос, чтобы получить таблицу.');
            return;
        }

        downloadExcel(lastSqlResult.columns, lastSqlResult.rows, 'chat.xlsx');
    }

    // =========================================
    // СКАЧИВАНИЕ DOCX (с таблицей)
    // =========================================
    function downloadChatDocx() {
        const content = getLastAssistantRawContent();
        if (!content) return;

        const payload = { content: content };

        if (lastSqlResult) {
            payload.table_columns = lastSqlResult.columns;
            payload.table_rows = lastSqlResult.rows;
        }

        downloadDocx(payload, 'chat.docx');
    }

    // =========================================
    // ЗАКРЫТИЕ DROPDOWN ПРИ КЛИКЕ ВНЕ
    // =========================================
    document.addEventListener('click', function(e) {
        document.querySelectorAll('.dl-dropdown-menu.show').forEach(function(menu) {
            if (!menu.contains(e.target) && !menu.parentElement.contains(e.target)) {
                menu.classList.remove('show');
            }
        });
    });

    // =========================================
    // AUTO-RESIZE TEXTAREA
    // =========================================
    questionInput.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });

    questionInput.style.height = "auto";
    questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + "px";

    // =========================================
    // ВСПОМОГАТЕЛЬНАЯ: ESCAPE HTML
    // =========================================
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // =========================================
    // ОБНОВЛЕНИЕ SQL-КОНТЕКСТА (ЦЕНТРАЛЬНАЯ ФУНКЦИЯ)
    // =========================================
    function updateSqlContext(newSql) {
        sqlQuery = newSql;
        lastExecutedSql = newSql;
        
        sqlPreview.textContent = newSql;
        sqlPreview.title = newSql;
        
        sqlPreview.classList.add('updated');
        setTimeout(() => {
            sqlPreview.classList.remove('updated');
        }, 2000);
        
        console.log('[SQL CONTEXT] Обновлён:', newSql.substring(0, 100));
    }

    // =========================================
    // ПОКАЗ РЕЗУЛЬТАТА SQL В ЧАТЕ
    // =========================================
    function showSqlResult(sql, data) {
        const columns = data.columns || [];
        const rows = data.rows || [];

        // Обновляем глобальный контекст SQL
        updateSqlContext(sql);

        // Формируем текстовое представление таблицы для промпта
        let tableText = "";
        if (columns.length > 0) {
            tableText += columns.join(" | ") + "\n";
            tableText += columns.map(() => "---").join(" | ") + "\n";
            const displayRows = rows.slice(0, 50);
            displayRows.forEach(row => {
                tableText += row.map(v => (v !== null ? String(v) : "NULL")).join(" | ") + "\n";
            });
            if (rows.length > 50) {
                tableText += `\n... и ещё ${rows.length - 50} строк (показаны первые 50) ...\n`;
            }
        }
        lastSqlResultData = tableText;
        lastSqlResult = data;

        let html = '<div class="sql-result-block">';

        if (columns.length > 0) {
            html += '<table id="resultTable"><thead><tr>';
            columns.forEach(col => {
                html += '<th>' + escapeHtml(col) + '</th>';
            });
            html += '</tr></thead><tbody>';

            const displayRows = rows.slice(0, 50);
            displayRows.forEach(row => {
                html += '<tr>';
                row.forEach(val => {
                    html += '<td>' + escapeHtml(val !== null ? String(val) : 'NULL') + '</td>';
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
        }

        html += '<div class="sql-result-meta">';
        html += ' Найдено строк: <strong>' + rows.length + '</strong>';
        if (rows.length > 50) {
            html += ' (показаны первые 50)';
        }
        html += '</div>';

        html += '</div>';

        addMessage("assistant",
            '<div class="msg-label" style="color:var(--text-success);">▶ Результат выполнения SQL</div>' + html,
            'Результат выполнения SQL: ' + rows.length + ' строк\n' +
            'SQL: ' + sql
        );
    }

    function showSqlError(sql, errorMessage) {
        const errorId = 'sql_err_' + Date.now();

        let html = '<div class="sql-error-block" id="' + errorId + '">';
        html += '<strong style="color:var(--text-error);"> Ошибка выполнения SQL:</strong><br>';
        html += escapeHtml(errorMessage);
        html += '</div>';

        html += '<button class="sql-error-analyze-btn" onclick="analyzeSqlError(\'' + errorId + '\', \'' + escapeHtml(sql.replace(/'/g, "\\'")) + '\')">';
        html += ' Анализировать ошибку</button>';

        addMessage("assistant",
            '<div class="msg-label" style="color:var(--text-error);">⚠️ Ошибка SQL</div>' + html,
            'Ошибка SQL: ' + errorMessage
        );
    }

    window.analyzeSqlError = function(errorId, sql) {
        const errorBlock = document.getElementById(errorId);
        if (!errorBlock) return;

        const errorText = errorBlock.textContent.replace(' Ошибка выполнения SQL:', '').trim();
        errorBlock.innerHTML = '<p style="color:var(--text-loading);"> Анализирую ошибку...</p>';

        fetch('/analyze_sql_error_ajax', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sql_query: sql, error: errorText })
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                errorBlock.innerHTML = data.analysis;
            } else {
                errorBlock.innerHTML = '<p style="color:var(--text-error);"> Ошибка анализа: ' + escapeHtml(data.message || 'Неизвестная ошибка') + '</p>';
            }
        })
        .catch(err => {
            errorBlock.innerHTML = '<p style="color:var(--text-error);"> Ошибка сети: ' + escapeHtml(err.message) + '</p>';
        });
    };

    // =========================================
    // КНОПКИ КОПИРОВАНИЯ КОДА И ЗАПУСКА КОДА
    // =============================================
    function addCodeActionButtons(container) {
        const preBlocks = container.querySelectorAll('pre');
        preBlocks.forEach(pre => {
            const code = pre.querySelector('code');
            const text = code ? code.textContent : pre.textContent;

            if (!pre.querySelector('.copy-code-btn')) {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-code-btn';
                copyBtn.title = 'Скопировать код';
                copyBtn.setAttribute('aria-label', 'Скопировать код');
                copyBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

                copyBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(() => {
                            showCopiedFeedback(this);
                        }).catch(() => {
                            fallbackCopy(text, this);
                        });
                    } else {
                        fallbackCopy(text, this);
                    }
                });

                pre.appendChild(copyBtn);
            }

            if (!pre.querySelector('.run-code-btn')) {
                const runBtn = document.createElement('button');
                runBtn.className = 'run-code-btn';
                runBtn.title = 'Запустить SQL-код (результат в чате)';
                runBtn.setAttribute('aria-label', 'Запустить SQL-код');
                runBtn.innerHTML = '▶ Запустить';

                runBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();

                    if (this.classList.contains('running')) return;

                    const code = text;
                    const btn = this;
                    btn.classList.add('running');
                    btn.innerHTML = '⏳';

                    fetch('/execute_sql_ajax', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sql_query: code })
                    })
                    .then(r => r.json())
                    .then(data => {
                        btn.classList.remove('running');
                        btn.innerHTML = '▶ Запустить';

                        if (data.status === 'ok') {
                            showSqlResult(code, data);
                        } else {
                            showSqlError(code, data.message || 'Неизвестная ошибка');
                        }
                    })
                    .catch(err => {
                        btn.classList.remove('running');
                        btn.innerHTML = '▶ Запустить';
                        showSqlError(code, 'Ошибка сети: ' + err.message);
                    });
                });

                pre.appendChild(runBtn);
            }
        });
    }

    function fallbackCopy(text, btn) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showCopiedFeedback(btn);
        } catch (err) {
            console.error('Ошибка копирования:', err);
        }
        document.body.removeChild(textarea);
    }

    function showCopiedFeedback(btn) {
        const originalHtml = btn.innerHTML;
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerHTML = originalHtml;
            btn.classList.remove('copied');
        }, 2000);
    }

    // =========================================
    // ADD MESSAGE TO CHAT (С ЕДИНОЙ КНОПКОЙ СКАЧИВАНИЯ)
    // =========================================
    function addMessage(role, htmlContent, rawContent) {
        const loadingEl = document.getElementById("loadingMsg");
        if (loadingEl) {
            loadingEl.remove();
        }

        // Удаляем старые dropdown-меню из предыдущих сообщений
        document.querySelectorAll('.message.assistant .download-buttons').forEach(el => el.remove());

        const div = document.createElement("div");
        div.className = `message ${role}`;

        if (role === "assistant") {
            const label = document.createElement("div");
            label.className = "msg-label";
            label.textContent = "Ассистент";
            div.appendChild(label);
        }

        const contentDiv = document.createElement("div");
        contentDiv.className = "markdown-content";
        contentDiv.innerHTML = htmlContent;
        div.appendChild(contentDiv);

        addCodeActionButtons(contentDiv);

        if (role === "assistant") {
            div.setAttribute('data-raw-content', rawContent || htmlContent);

            // ===== ЕДИНАЯ КНОПКА СКАЧИВАНИЯ С DROPDOWN =====
            const btnContainer = document.createElement("div");
            btnContainer.className = "download-buttons";

            const dlWrapper = document.createElement("div");
            dlWrapper.className = "dl-dropdown-wrapper";

            // Основная кнопка
            const dlBtn = document.createElement("button");
            dlBtn.className = "dl-btn btn-download";
            dlBtn.innerHTML = "Скачать ▾";
            dlBtn.type = "button";
            dlBtn.onclick = function(e) {
                e.stopPropagation();
                e.preventDefault();
                // Закрыть все другие открытые dropdown
                document.querySelectorAll('.dl-dropdown-menu.show').forEach(function(m) {
                    if (m !== dlMenu) m.classList.remove('show');
                });
                dlMenu.classList.toggle('show');
            };

            // Выпадающее меню
            const dlMenu = document.createElement("div");
            dlMenu.className = "dl-dropdown-menu";

            // --- Word ---
            const itemWord = document.createElement("button");
            itemWord.className = "dl-dropdown-item";
            itemWord.type = "button";
            itemWord.innerHTML = '<span class="dl-icon">📄</span><span class="dl-label">Word</span><span class="dl-ext">.docx</span>';
            itemWord.onclick = function(e) {
                e.stopPropagation();
                e.preventDefault();
                dlMenu.classList.remove('show');
                downloadChatDocx();
            };
            dlMenu.appendChild(itemWord);

            // --- Text ---
            const itemText = document.createElement("button");
            itemText.className = "dl-dropdown-item";
            itemText.type = "button";
            itemText.innerHTML = '<span class="dl-icon">📝</span><span class="dl-label">Text</span><span class="dl-ext">.txt</span>';
            itemText.onclick = function(e) {
                e.stopPropagation();
                e.preventDefault();
                dlMenu.classList.remove('show');
                downloadChatText();
            };
            dlMenu.appendChild(itemText);

            // --- Разделитель ---
            const divider = document.createElement("div");
            divider.className = "dl-dropdown-divider";
            dlMenu.appendChild(divider);

            // --- Excel (только если есть таблица) ---
            const hasTable = lastSqlResult && lastSqlResult.rows && lastSqlResult.rows.length > 0;

            const itemExcel = document.createElement("button");
            itemExcel.className = "dl-dropdown-item" + (hasTable ? "" : " dl-disabled");
            itemExcel.type = "button";
            itemExcel.innerHTML = '<span class="dl-icon">📊</span><span class="dl-label">Excel</span><span class="dl-ext">.xlsx</span>';
            itemExcel.title = hasTable ? "Скачать результат SQL в Excel" : "Нет табличных данных — выполните SQL-запрос";
            itemExcel.onclick = function(e) {
                e.stopPropagation();
                e.preventDefault();
                dlMenu.classList.remove('show');
                if (hasTable) {
                    downloadChatExcel();
                }
            };
            dlMenu.appendChild(itemExcel);

            dlWrapper.appendChild(dlBtn);
            dlWrapper.appendChild(dlMenu);
            btnContainer.appendChild(dlWrapper);
            div.appendChild(btnContainer);
        }

        chatMessages.appendChild(div);

        messages.push({
            role: role,
            content: rawContent || htmlContent
        });

        scrollToBottom();
    }

    function addTypingMessage() {
        const div = document.createElement("div");
        div.className = "message assistant loading-msg";
        div.id = "typingMsg";

        const label = document.createElement("div");
        label.className = "msg-label";
        label.textContent = "Ассистент";
        div.appendChild(label);

        const indicator = document.createElement("div");
        indicator.className = "typing-indicator";
        indicator.innerHTML = "<span></span><span></span><span></span>";
        div.appendChild(indicator);

        const text = document.createElement("div");
        text.style.cssText = "margin-top:6px; color:var(--text-secondary); font-size:13px;";
        text.textContent = "Думаю...";
        div.appendChild(text);

        chatMessages.appendChild(div);
        scrollToBottom();
        return div;
    }

    function removeTypingMessage() {
        const el = document.getElementById("typingMsg");
        if (el) el.remove();
    }

    function scrollToBottom() {
        setTimeout(() => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 50);
    }

    function openGrafPage() {
        const query = lastExecutedSql || sqlQuery || "";
        if (!query) {
            if (!confirm('Нет SQL-запроса. Открыть страницу графика без запроса?')) {
                return;
            }
        }
        window.open('/graf?sql_query=' + encodeURIComponent(query), '_blank');
    }

    function openTablePage() {
        try {
            let tableData = null;

            if (lastSqlResult && lastSqlResult.rows && lastSqlResult.rows.length > 0) {
                tableData = {
                    sql_query: lastExecutedSql || sqlQuery || "",
                    columns: lastSqlResult.columns,
                    rows: lastSqlResult.rows
                };
            } else {
                // Попытка распарсить таблицу из DOM (если результат был отрисован серверно)
                let tableEl = document.getElementById('resultTable');
                if (!tableEl) {
                    tableEl = document.querySelector('.sql-result-block table') || document.querySelector('#resultBlock table') || document.querySelector('table');
                }
                if (tableEl) {
                    const cols = [];
                    const ths = tableEl.querySelectorAll('thead th');
                    if (ths && ths.length) {
                        ths.forEach(th => cols.push(th.textContent.trim()));
                    }
                    const rows = [];
                    const trs = tableEl.querySelectorAll('tbody tr');
                    trs.forEach(tr => {
                        const cells = Array.from(tr.querySelectorAll('td'));
                        const row = cells.map(td => td.textContent);
                        rows.push(row);
                    });
                    if (cols.length || rows.length) {
                        tableData = { sql_query: sqlPreview ? sqlPreview.textContent : '', columns: cols, rows: rows };
                    }
                }
            }

            if (!tableData) {
                alert('Сначала выполните SQL-запрос, чтобы открыть данные таблицы.');
                return;
            }

            localStorage.setItem('chatTableData', JSON.stringify(tableData));
            console.debug('[CHAT] chatTableData saved', tableData);
            // ===== ИСПРАВЛЕНИЕ: открываем в новой вкладке =====
            window.open('/table', '_blank');
        } catch (err) {
            console.error('Не удалось сохранить данные таблицы в localStorage:', err);
            alert('Ошибка при открытии таблицы: ' + err.message);
        }
    }

    // =========================================
    // LOAD INITIAL EXPLANATION
    // =========================================
    async function loadInitialExplanation() {
        try {
            if (!sqlQuery) {
                addMessage(
                    "assistant",
                    `<p style="color:var(--text-secondary);">Нет SQL-запроса для анализа. Задайте вопрос через поле ввода.</p>`,
                    "Нет SQL-запроса"
                );
                askBtn.disabled = false;
                return;
            }

            const requestBody = { sql_query: sqlQuery };

            const response = await fetch("/explain_sql", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (data.status !== "ok") {
                addMessage(
                    "assistant",
                    `<p style="color:var(--text-error);"> Ошибка: ${escapeHtml(data.message)}</p>`,
                    `Ошибка: ${data.message}`
                );
                askBtn.disabled = false;
                return;
            }

            addMessage("assistant", data.explanation, data.explanation_raw);
            askBtn.disabled = false;

        } catch (err) {
            addMessage(
                "assistant",
                `<p style="color:var(--text-error);"> Ошибка загрузки: ${escapeHtml(err.message || err)}</p>`,
                `Ошибка загрузки: ${err}`
            );
            askBtn.disabled = false;
        }
    }

    // =========================================
    // ASK FOLLOW-UP QUESTION
    // =========================================
    async function askQuestion() {
        const question = questionInput.value.trim();
        if (!question) return;

        if (isRecording) {
            isRecording = false;
            if (recognition) recognition.stop();
            micBtn.classList.remove('recording');
            micStatus.textContent = '';
        }

        addMessage("user", `<p>${escapeHtml(question)}</p>`, question);

        questionInput.value = "";
        questionInput.style.height = "auto";
        fullVoiceText = '';

        askBtn.disabled = true;
        askBtn.textContent = "⏳";
        askBtn.classList.add("loading");

        addTypingMessage();

        try {
            const currentSqlForPrompt = sqlQuery || lastExecutedSql || "";
            
            console.log('[ASK] SQL контекст для промпта:', currentSqlForPrompt.substring(0, 100));
            
            const requestBody = {
                question: question,
                history: messages.slice(0, -1),
                sql_query: currentSqlForPrompt,
                sql_data: lastSqlResultData
            };

            const response = await fetch("/chat_ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            removeTypingMessage();

            if (data.status !== "ok") {
                addMessage(
                    "assistant",
                    `<p style="color:var(--text-error);"> Ошибка: ${escapeHtml(data.message)}</p>`,
                    `Ошибка: ${data.message}`
                );
                return;
            }

            addMessage("assistant", data.answer, data.answer_raw || data.answer);

        } catch (err) {
            removeTypingMessage();
            addMessage(
                "assistant",
                `<p style="color:var(--text-error);"> Ошибка запроса: ${escapeHtml(err.message || err)}</p>`,
                `Ошибка запроса: ${err}`
            );
        } finally {
            askBtn.disabled = false;
            askBtn.textContent = "Спросить →";
            askBtn.classList.remove("loading");
            questionInput.focus();
        }
    }

    // =========================================
    // EVENT LISTENERS
    // =========================================
    askBtn.addEventListener("click", askQuestion);
    if (grafBtn) {
        grafBtn.addEventListener("click", openGrafPage);
    }
    if (tableBtn) {
        tableBtn.addEventListener("click", openTablePage);
    }

    questionInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            if (!askBtn.disabled) {
                askQuestion();
            }
        }
    });

    // =========================================
    // INIT
    // =========================================
    loadInitialExplanation();
</script>
</body>
</html>
