<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text2BI — Вход</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f8f9fa; color:#212529; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .login-card { background:#fff; border-radius:12px; padding:40px; width:100%; max-width:380px; box-shadow:0 4px 24px rgba(0,0,0,0.1); border:none; }
        h1 { text-align:center; color:#1a1e2e; margin-bottom:8px; font-size:24px; }
        .subtitle { text-align:center; color:#6c757d; margin-bottom:28px; font-size:13px; }
        label { display:block; margin-bottom:6px; color:#495057; font-size:13px; font-weight:500; }
        input[type="text"], input[type="password"] { width:100%; padding:12px; border-radius:8px; border:1px solid #ced4da; background:#fff; color:#212529; margin-bottom:16px; font-size:14px; outline:none; transition:.2s; }
        input:focus { border-color:#0d6efd; box-shadow:0 0 0 0.2rem rgba(13,110,253,0.15); }
        button { width:100%; padding:12px; border-radius:8px; border:none; background:#0d6efd; color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:.2s; }
        button:hover { background:#0b5ed7; }
        .error { background:#f8d7da; border:none; color:#842029; padding:10px; border-radius:8px; margin-bottom:16px; text-align:center; font-size:13px; }
        .hint { margin-top:20px; text-align:center; color:#6c757d; font-size:12px; }
        .hint code { background:#e9ecef; padding:2px 6px; border-radius:4px; color:#0d6efd; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Text2BI</h1>
        <div class="subtitle">Аналитическая платформа</div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Логин</label>
            <input type="text" name="username" placeholder="alex или max" required autofocus>
            <label>Пароль</label>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <div class="hint">Пользователи: <code>alex / secret</code> &nbsp;|&nbsp; <code>max / secret</code></div>
    </div>
</body>
</html>
