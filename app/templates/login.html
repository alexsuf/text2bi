<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text2BI — Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg-body); color:var(--text-primary); display:flex; justify-content:center; align-items:center; min-height:100vh; transition:background-color 0.3s ease,color 0.3s ease; }
        .login-card { background:var(--bg-surface); border-radius:12px; padding:40px; width:100%; max-width:380px; box-shadow:var(--shadow-btn); border:none; transition:background-color 0.3s ease; }
        h1 { text-align:center; color:var(--text-accent); margin-bottom:8px; font-size:24px; }
        .subtitle { text-align:center; color:var(--text-secondary); margin-bottom:28px; font-size:13px; }
        label { display:block; margin-bottom:6px; color:var(--text-secondary); font-size:13px; font-weight:500; }
        input[type="text"], input[type="password"] { width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-input); background:var(--bg-input); color:var(--text-primary); margin-bottom:16px; font-size:14px; outline:none; transition:.2s; }
        input:focus { border-color:var(--border-input-focus); box-shadow:0 0 0 0.2rem rgba(13,110,253,0.15); }
        button { width:100%; padding:12px; border-radius:8px; border:none; background:var(--gradient-primary); color:var(--text-on-primary); font-size:15px; font-weight:600; cursor:pointer; transition:.2s; }
        button:hover { transform:translateY(-1px); opacity:0.92; }
        .error { background:var(--bg-error-block); border:none; color:var(--text-error); padding:10px; border-radius:8px; margin-bottom:16px; text-align:center; font-size:13px; }
        .hint { margin-top:20px; text-align:center; color:var(--text-muted); font-size:12px; }
        .hint code { background:var(--bg-surface-alt); padding:2px 6px; border-radius:4px; color:var(--text-accent); }
    </style>
</head>
<body>
    <script>
        (function(){var t=localStorage.getItem('app-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();
    </script>
    <div class="login-card">
        <h1>Text2BI</h1>
        <div class="subtitle">Аналитическая платформа</div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Логин</label>
            <input type="text" name="username" placeholder="alex или max" required autofocus>
            <label>Пароль</label>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <div class="hint">Пользователи: <code>alex / secret</code> &nbsp;|&nbsp; <code>max / secret</code></div>
    </div>
</body>
</html>
