{% extends "base.html" %}

{% block title %}{% if model %}Редактировать модель{% else %}Добавить модель{% endif %}{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>{% if model %}Редактировать модель{% else %}Добавить модель{% endif %}</h2>

  <form method="POST" action="{% if model %}/models/update/{{ model.id }}{% else %}/models/new{% endif %}">
    <div class="mb-3">
      <label for="provider_id" class="form-label">Провайдер *</label>
      <select class="form-select" id="provider_id" name="provider_id" required>
        <option value="">Выберите провайдер</option>
        {% for p in providers %}
        <option value="{{ p.id }}" {% if model and model.provider_id == p.id %}selected{% endif %}>
          {{ p.name }} ({{ p.base_url }})
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="model_name" class="form-label">Название модели *</label>
      <input type="text" class="form-control" id="model_name" name="model_name" value="{{ model.model_name if model else '' }}" required>
    </div>

    <div class="mb-3">
      <label for="display_name" class="form-label">Отображаемое имя</label>
      <input type="text" class="form-control" id="display_name" name="display_name" value="{{ model.display_name if model else '' }}">
    </div>

    <div class="mb-3">
      <label for="context_size" class="form-label">Размер контекста (токенов)</label>
      <input type="number" class="form-control" id="context_size" name="context_size" value="{{ model.context_size if model else '' }}">
    </div>

    <div class="mb-3">
      <label for="max_tokens" class="form-label">Макс. токенов на ответ</label>
      <input type="number" class="form-control" id="max_tokens" name="max_tokens" value="{{ model.max_tokens if model else '' }}">
    </div>

    <div class="mb-3">
      <label for="temperature" class="form-label">Температура (0.0–1.0)</label>
      <input type="number" class="form-control" id="temperature" name="temperature" step="0.1" min="0" max="1" value="{{ model.temperature if model else '0.7' }}">
    </div>

    <div class="mb-3 form-check">
      <input class="form-check-input" type="checkbox" id="enabled" name="enabled" {% if not model or model.enabled %}checked{% endif %}>
      <label class="form-check-label" for="enabled">Включена</label>
    </div>

    <div class="mb-3 form-check">
      <input class="form-check-input" type="checkbox" id="is_default" name="is_default" {% if model and model.is_default %}checked{% endif %}>
      <label class="form-check-label" for="is_default">Сделать по умолчанию</label>
    </div>

    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/models" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
