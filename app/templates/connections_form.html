{% extends "base.html" %}
{% block title %}Изменить подключение{% endblock %}
{% block content %}
<h2 class="mb-4">Изменить подключение</h2>
<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3"><label class="form-label">Host</label><input type="text" name="host" class="form-control" value="{{ connection.host }}" required></div>
            <div class="mb-3"><label class="form-label">Port</label><input type="number" name="port" class="form-control" value="{{ connection.port }}" required></div>
            <div class="mb-3"><label class="form-label">Database</label><input type="text" name="database_name" class="form-control" value="{{ connection.database_name }}" required></div>
            <div class="mb-3"><label class="form-label">User</label><input type="text" name="username" class="form-control" value="{{ connection.username }}" required></div>
            <div class="mb-3"><label class="form-label">Password <small class="text-muted">(оставьте пустым чтобы не менять)</small></label><input type="password" name="password" class="form-control" value="" placeholder="оставьте пустым чтобы не менять" autocomplete="off"></div>
            <div class="mb-3 form-check"><input type="checkbox" name="is_default" class="form-check-input" id="is_default" {% if connection.is_default %}checked{% endif %}><label class="form-check-label" for="is_default">По умолчанию</label></div>
            <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Сохранить</button><a href="/connections" class="btn btn-secondary">Отмена</a></div>
        </form>
    </div>
</div>
{% endblock %}
