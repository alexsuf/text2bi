{% extends "base.html" %}
{% block title %}Конфигурация{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Конфигурация системы</h2>
</div>
<div id="configList">
{% if configs %}
{% for c in configs %}
<div class="card mb-3" id="config_{{ c.key }}">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <strong class="text-primary">{{ c.key }}</strong>
        </div>
        <div class="mb-2">
            <label style="color:var(--text-secondary);font-size:12px;">Значение</label>
            <textarea id="configValue_{{ c.key }}" class="form-control" rows="3" style="font-family:monospace;font-size:13px;">{{ c.value }}</textarea>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-sm" style="background:var(--gradient-primary); color:var(--text-on-primary);" onclick="saveConfig('{{ c.key }}')">Сохранить</button>
        </div>
    </div>
</div>
{% endfor %}
{% else %}
<p class="text-muted text-center py-4">Нет конфигураций</p>
{% endif %}
</div>
{% endblock %}

{% block scripts %}
<script>
async function saveConfig(key) {
    const value = document.getElementById('configValue_' + key).value;
    const btn = document.querySelector('#config_' + key + ' .btn-blue');
    if (btn) {
        btn.textContent = 'Сохраняется...';
        btn.disabled = true;
    }
    try {
        const r = await fetch('/api/system_config/' + encodeURIComponent(key), {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({value: value})
        });
        const d = await r.json();
        if (d.status === 'ok') {
            if (btn) {
                btn.textContent = 'Сохранено';
                setTimeout(() => {
                    btn.textContent = 'Сохранить';
                    btn.disabled = false;
                }, 1000);
            }
        } else {
            alert('Ошибка: ' + (d.message || 'Неизвестная ошибка'));
            if (btn) {
                btn.textContent = 'Сохранить';
                btn.disabled = false;
            }
        }
    } catch (e) {
        alert('Ошибка сохранения: ' + e.message);
        if (btn) {
            btn.textContent = 'Сохранить';
            btn.disabled = false;
        }
    }
}
</script>
{% endblock %}
